name: Windows build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Frontend deps
        run: npm ci

      - name: Build (NSIS + MSI)
        run: npx tauri build

      - name: List bundles
        shell: bash
        run: find src-tauri/target/release/bundle -name "*.exe" -o -name "*.msi"

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            src-tauri/target/release/bundle/nsis/*.exe \
            src-tauri/target/release/bundle/msi/*.msi \
            --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Archive artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: sokhan-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
